<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student List | Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 p-0 sidebar">
            <div class="p-4">
                <h3 class="mb-4"><i class="bi bi-mortarboard"></i> Academe</h3>
                <p class="small text-secondary">Student Registry System</p>
            </div>
            <nav class="nav flex-column">
                <a class="nav-link" href="/">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
                <a class="nav-link active" href="/student-list">
                    <i class="bi bi-people"></i> Student List
                </a>
                <a class="nav-link" href="/student-info">
                    <i class="bi bi-person-badge"></i> Student Info
                </a>
            </nav>
            <div class="position-absolute bottom-0 p-4">
                <small class="text-secondary">v3.0 | Forms 1-3</small>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="col-md-10 main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="bi bi-people"></i> Student List</h2>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addStudentModal">
                    <i class="bi bi-plus-lg"></i> Add New Student
                </button>
            </div>
            
            <!-- Filter Bar -->
            <div class="filter-bar mb-4">
                <div class="row g-2">
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="searchInput" placeholder="Search by name or class..." onkeyup="filterStudents()">
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" id="classFilter" onchange="filterStudents()">
                            <option value="">All Classes</option>
                            <option value="Form 1">Form 1</option>
                            <option value="Form 2">Form 2</option>
                            <option value="Form 3">Form 3</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" id="houseFilter" onchange="filterStudents()">
                            <option value="">All Houses</option>
                            <option value="Acacia">Acacia</option>
                            <option value="Baobab">Baobab</option>
                            <option value="Palm">Palm</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" id="genderFilter" onchange="filterStudents()">
                            <option value="">All Genders</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary w-100" onclick="exportToCSV()">
                            <i class="bi bi-download"></i> Export CSV
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Students Table -->
            <div class="table-card">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th onclick="sortBy('id')" style="cursor: pointer;">ID <i class="bi bi-arrow-down-up"></i></th>
                                <th onclick="sortBy('student_name')" style="cursor: pointer;">Student Name</th>
                                <th onclick="sortBy('class')" style="cursor: pointer;">Class</th>
                                <th onclick="sortBy('gender')" style="cursor: pointer;">Gender</th>
                                <th onclick="sortBy('house')" style="cursor: pointer;">House</th>
                                <th>Primary Contact</th>
                                <th>Secondary Contact</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="students-tbody"></tbody>
                    </table>
                </div>
                <div id="no-results" class="text-center p-5" style="display: none;">
                    <i class="bi bi-inbox" style="font-size: 3rem;"></i>
                    <p class="mt-2 text-muted">No students found</p>
                </div>
                <div class="p-3 d-flex justify-content-between align-items-center">
                    <div id="pagination-info"></div>
                    <div id="pagination-container"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add Student Modal -->
<div class="modal fade" id="addStudentModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title"><i class="bi bi-person-plus"></i> Add New Student</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Student ID *</label>
                        <input type="text" class="form-control" id="f-id" placeholder="e.g., STU-001">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Student Name *</label>
                        <input type="text" class="form-control" id="f-name" placeholder="First and Last Name">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Class *</label>
                        <select class="form-select" id="f-class">
                            <option value="">Select Class</option>
                            <option value="Form 1">Form 1</option>
                            <option value="Form 2">Form 2</option>
                            <option value="Form 3">Form 3</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Gender *</label>
                        <select class="form-select" id="f-gender">
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">House *</label>
                        <select class="form-select" id="f-house">
                            <option value="">Select House</option>
                            <option value="Acacia">Acacia</option>
                            <option value="Baobab">Baobab</option>
                            <option value="Palm">Palm</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Primary Contact *</label>
                        <input type="text" class="form-control" id="f-primary" placeholder="Phone number with country code">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Secondary Contact</label>
                        <input type="text" class="form-control" id="f-secondary" placeholder="Optional alternative number">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveStudent()">Save Student</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let allStudents = [];
    let filteredStudents = [];
    let currentPage = 1;
    let perPage = 10;
    let sortKey = 'student_name';
    let sortAsc = true;
    let editingId = null;

    async function filterStudents() {
        const search = document.getElementById('searchInput')?.value || '';
        const classFilter = document.getElementById('classFilter')?.value || '';
        const house = document.getElementById('houseFilter')?.value || '';
        const gender = document.getElementById('genderFilter')?.value || '';
        
        try {
            let url = `/api/students/search?`;
            if (search) url += `q=${encodeURIComponent(search)}&`;
            if (classFilter) url += `class=${encodeURIComponent(classFilter)}&`;
            if (house) url += `house=${encodeURIComponent(house)}&`;
            if (gender) url += `gender=${encodeURIComponent(gender)}`;
            const response = await fetch(url);
            const result = await response.json();
            if (result.success) {
                allStudents = result.data;
                filteredStudents = [...allStudents];
                if (sortKey) sortStudents();
                currentPage = 1;
                renderTable();
            }
        } catch (error) {
            console.error('Filter error:', error);
        }
    }

    function sortBy(key) {
        if (sortKey === key) sortAsc = !sortAsc;
        else { sortKey = key; sortAsc = true; }
        sortStudents();
        renderTable();
    }

    function sortStudents() {
        filteredStudents.sort((a, b) => {
            let valA = a[sortKey] || '';
            let valB = b[sortKey] || '';
            return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
        });
    }

    function renderTable() {
        const tbody = document.getElementById('students-tbody');
        const noResults = document.getElementById('no-results');
        if (!tbody) return;
        
        const start = (currentPage - 1) * perPage;
        const pageStudents = filteredStudents.slice(start, start + perPage);
        
        if (filteredStudents.length === 0) {
            tbody.innerHTML = '';
            if (noResults) noResults.style.display = 'block';
        } else {
            if (noResults) noResults.style.display = 'none';
            tbody.innerHTML = pageStudents.map(s => `
                <tr>
                    <td><span class="badge bg-secondary">${s.id}</span></div></td>
                    <td><strong>${s.student_name}</strong></div></div></div></td>
                    <td><span class="class-badge">${s.class}</span></div></div></div></div></td>
                    <td>${s.gender}</div></div></div></div></div></td>
                    <td><span class="house-badge house-${s.house.toLowerCase()}">${s.house}</span></div></div></div></div></div></div></td>
                    <td>${s.primary_contact}</div></div></div></div></div></div></div></td>
                    <td>${s.secondary_contact || '-'}</div></div></div></div></div></div></div></div></td>
                    <td>
                        <a href="/student-info?id=${s.id}" class="btn btn-sm btn-primary me-1">
                            <i class="bi bi-eye"></i>
                        </a>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteStudent('${s.id}')">
                            <i class="bi bi-trash"></i>
                        </button>
                     </div>
                 </div>
            `).join('');
        }
        
        const totalPages = Math.ceil(filteredStudents.length / perPage);
        const container = document.getElementById('pagination-container');
        const info = document.getElementById('pagination-info');
        
        if (container) {
            if (totalPages <= 1) {
                container.innerHTML = '';
            } else {
                let html = '<nav><ul class="pagination pagination-sm mb-0">';
                html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><a class="page-link" href="#" onclick="changePage(${currentPage - 1})">Prev</a></li>`;
                for (let i = 1; i <= Math.min(totalPages, 5); i++) {
                    html += `<li class="page-item ${i === currentPage ? 'active' : ''}"><a class="page-link" href="#" onclick="changePage(${i})">${i}</a></li>`;
                }
                if (totalPages > 5) html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}"><a class="page-link" href="#" onclick="changePage(${currentPage + 1})">Next</a></li>`;
                html += '</ul></nav>';
                container.innerHTML = html;
            }
        }
        
        if (info) {
            const startNum = (currentPage - 1) * perPage + 1;
            const endNum = Math.min(currentPage * perPage, filteredStudents.length);
            info.textContent = `Showing ${startNum}-${endNum} of ${filteredStudents.length} students`;
        }
    }

    function changePage(page) {
        currentPage = page;
        renderTable();
    }

    async function saveStudent() {
        const student = {
            id: document.getElementById('f-id').value.trim(),
            studentName: document.getElementById('f-name').value.trim(),
            class: document.getElementById('f-class').value,
            gender: document.getElementById('f-gender').value,
            house: document.getElementById('f-house').value,
            primaryContact: document.getElementById('f-primary').value.trim(),
            secondaryContact: document.getElementById('f-secondary').value.trim()
        };
        
        if (!student.id || !student.studentName || !student.class || !student.gender || !student.house || !student.primaryContact) {
            alert('Please fill all required fields (*)');
            return;
        }
        
        try {
            const response = await fetch('/api/students', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(student)
            });
            const result = await response.json();
            
            if (result.success) {
                alert(result.message);
                const modal = bootstrap.Modal.getInstance(document.getElementById('addStudentModal'));
                if (modal) modal.hide();
                filterStudents();
            } else {
                alert('Error: ' + result.message);
            }
        } catch (error) {
            alert('Error saving student');
        }
    }

    async function deleteStudent(id) {
        if (confirm('Are you sure you want to delete this student?')) {
            try {
                const response = await fetch(`/api/students/${id}`, { method: 'DELETE' });
                const result = await response.json();
                if (result.success) {
                    alert('Student deleted successfully');
                    filterStudents();
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                alert('Error deleting student');
            }
        }
    }

    async function exportToCSV() {
        try {
            const response = await fetch('/api/students');
            const result = await response.json();
            if (result.success) {
                const headers = ['ID', 'Student Name', 'Class', 'Gender', 'House', 'Primary Contact', 'Secondary Contact'];
                const rows = [headers];
                result.data.forEach(s => {
                    rows.push([s.id, s.student_name, s.class, s.gender, s.house, s.primary_contact, s.secondary_contact || '']);
                });
                const csv = rows.map(row => row.map(cell => `"${cell}"`).join(',')).join('\n');
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `students_${new Date().toISOString().slice(0,19)}.csv`;
                a.click();
                URL.revokeObjectURL(url);
                alert('CSV exported successfully!');
            }
        } catch (error) {
            alert('Error exporting CSV');
        }
    }

    filterStudents();
</script>
</body>
</html>
